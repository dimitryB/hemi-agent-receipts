# Builds the receipt viewer and publishes it on GitHub Pages, so anyone can open the examples
# without installing anything. The page verifies in the visitor's browser against Hemi's public
# RPC; nothing here holds a key or talks to the receipts service. Actions are pinned to commits.
name: Viewer on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - viewer/**
      - sdk/src/**
      - sdk/package.json
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w sdk && npm run build -w viewer
      - run: npm test -w viewer
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
